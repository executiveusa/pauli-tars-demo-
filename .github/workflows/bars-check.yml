name: BARS checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4, SHA-pinned
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5, SHA-pinned
        with:
          python-version: '3.12'
      - name: Identity regression
        run: python scripts/check_bars_identity.py
      - name: Security + adversarial ledger (all suites)
        run: bash tests/run_all.sh
      - name: Runtime syntax
        run: python -m py_compile server.py bars_router.py hue.py hands.py presence.py terabithia_adapter.py remote_bridge.py scripts/test_remote_bridge.py
      - name: Remote mission contract proof
        run: python scripts/test_remote_bridge.py
      - name: Launcher syntax
        run: bash -n 'Launch BARS.command'
      - name: Secret regression
        run: |
          test ! -f tars-duplex.json
          test ! -f bars-duplex.json
