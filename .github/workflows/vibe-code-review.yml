name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: executiveusa/open-code-review/.github/workflows/vibe-code-review.yml@ca8d7a87f30b556a3f898e59d6993f076852a188
    with:
      ocr_version: "1.11.8"   # exact integrity-locked package version
    secrets:
      llm_token: ${{ secrets.OPENROUTER_API_KEY }}
