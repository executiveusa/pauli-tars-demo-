name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: vibe-code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: executiveusa/open-code-review/.github/workflows/vibe-code-review.yml@864933213372cc488b3f2f2b1deaab84ea91b855
    with:
      ocr_version: "1.11.8"   # exact integrity-locked package version
      model: google/gemma-4-26b-a4b-it:free   # verified free at runtime (cost $0, no top-up);
                                         # non-reasoning, verdict-first. Upstream pool 429/503s
                                         # in bursts - retried on a cadence until a window opens.
                                         # Groq lane tried and ruled out: gpt-oss-120b org-shared
                                         # daily cap exhausted; qwen3.x OTPM 1000 < tool max_tokens;
                                         # gpt-oss-20b hidden reasoning eats output budget.
      review_concurrency: "1"   # serial review keeps the burst under free-tier token/min caps
    secrets:
      llm_token: ${{ secrets.OPENROUTER_API_KEY }}
