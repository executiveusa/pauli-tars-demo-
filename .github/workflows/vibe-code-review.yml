name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: vibe-code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: executiveusa/open-code-review/.github/workflows/vibe-code-review.yml@864933213372cc488b3f2f2b1deaab84ea91b855
    with:
      ocr_version: "1.11.8"   # exact integrity-locked package version
      model: google/gemma-4-26b-a4b-it:free   # verified free at runtime (cost $0, no top-up);
                                         # non-reasoning: hidden-thinking free models stalled
                                         # the 30-min review job; the gpt-5.3-codex default
                                         # drained the account
    secrets:
      llm_token: ${{ secrets.OPENROUTER_API_KEY }}
