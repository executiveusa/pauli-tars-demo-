name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: vibe-code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: executiveusa/open-code-review/.github/workflows/vibe-code-review.yml@864933213372cc488b3f2f2b1deaab84ea91b855
    with:
      ocr_version: "1.11.8"   # exact integrity-locked package version
      llm_url: https://api.groq.com/openai/v1/chat/completions   # Groq free tier ($0):
                                         # OpenRouter free pools are upstream-saturated (429/503)
                                         # and its hidden-thinking models stall the 30-min job
      model: openai/gpt-oss-120b   # verified live on Groq free: 2s, verdict-first, no spend
      review_concurrency: "1"   # serial review keeps the burst under free-tier token/min caps
    secrets:
      llm_token: ${{ secrets.GROQ_API_KEY }}
