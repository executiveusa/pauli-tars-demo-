name: Vibe Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: vibe-code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: executiveusa/open-code-review/.github/workflows/vibe-code-review.yml@864933213372cc488b3f2f2b1deaab84ea91b855
    with:
      ocr_version: "1.11.8"   # exact integrity-locked package version
      llm_url: https://openrouter.ai/api/v1/chat/completions
      model: nex-n2.5-pro:free   # FALLBACK 3: gemma-4-31b-it:free shared free pool saturated
                                # (post-BYOK attempts 23-25 all 9/9 failed, limit_source
                                # upstream_provider_shared_pool, 10:03-10:19 AM PDT 2026-09-12).
                                # Next: openrouter/free auto-router.
      review_concurrency: "1"   # serial review keeps the burst under free-tier token/min caps
    secrets:
      llm_token: ${{ secrets.OPENROUTER_API_KEY }}   # OpenRouter lane key; Groq lanes use GROQ_API_KEY + Groq llm_url
