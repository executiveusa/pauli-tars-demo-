name: Vibe Code Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: executiveusa/open-code-review/.github/workflows/vibe-code-review.yml@2fab76c0695d83d3ddb71be8ae4bc7e498a9137c   # re-pinned: same pinned tree + timeout-minutes 30->180
    with:
      ocr_version: "1.11.8"   # exact integrity-locked package version
    secrets:
      llm_token: ${{ secrets.OPENROUTER_API_KEY }}
