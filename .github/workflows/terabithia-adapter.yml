name: BARS Terabithia Adapter CI
on:
  pull_request:
    paths:
      - "terabithia_adapter.py"
      - "tests/test_terabithia_adapter.py"
      - "Launch BARS.command"
      - "engineering/pauli-control/**"
      - "media/hyperframes/**"
      - ".github/workflows/terabithia-adapter.yml"
permissions:
  contents: read
concurrency:
  group: terabithia-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m py_compile terabithia_adapter.py server.py
      - run: python tests/test_terabithia_adapter.py
      - run: bash -n 'Launch BARS.command'
      - run: npm ci --no-audit --no-fund && npm test
        working-directory: engineering/pauli-control
      - run: npm ci --no-audit --no-fund && npm test
        working-directory: media/hyperframes
