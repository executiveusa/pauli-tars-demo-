name: BARS Terabithia Adapter CI
on:
  pull_request:
    paths:
      - "terabithia_adapter.py"
      - "Launch BARS.command"
      - ".github/workflows/terabithia-adapter.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile terabithia_adapter.py server.py
      - run: bash -n 'Launch BARS.command'
