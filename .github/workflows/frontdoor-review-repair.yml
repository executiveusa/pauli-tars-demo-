name: BARS front door review repair

on:
  push:
    branches:
      - feature/bars-3d-frontdoor-v1

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed fixes
        run: python scripts/apply_frontdoor_review_fixes.py
      - name: Verify Python syntax
        run: python -m py_compile server.py scripts/verify_frontdoor.py scripts/apply_frontdoor_review_fixes.py
      - name: Verify front door contract
        run: python scripts/verify_frontdoor.py
      - name: Commit repaired slice
        run: |
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py static/frontdoor.html scripts/verify_frontdoor.py
          git commit -m "[bars-frontdoor] Apply independent review fixes"
          git push origin HEAD:feature/bars-3d-frontdoor-v1
