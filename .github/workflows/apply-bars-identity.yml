name: Apply BARS identity migration

on:
  push:
    branches:
      - fix/bars-identity-proof

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[bars-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bars-identity-proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply inspected migration
        run: python scripts/apply_bars_identity_migration.py
      - name: Check product identity
        run: python scripts/check_bars_identity.py
      - name: Syntax check runtime
        run: python -m py_compile server.py bars_router.py hue.py hands.py presence.py
      - name: Commit deterministic patch
        run: |
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.py static/index.html
          git commit -m '[bars-patch] Apply verified BARS identity migration'
          git push origin HEAD:fix/bars-identity-proof
