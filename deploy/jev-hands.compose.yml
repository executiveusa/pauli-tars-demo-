# Overlay used with docker-compose.yml. The runner is reachable to BARS only on
# this private network; its host publication is loopback-only for operator probes.
services:
  bars:
    environment:
      - BARS_JEV_RUNNER_URL=http://jev-runner:8643
    networks: [bars-senses]
    depends_on:
      jev-runner:
        condition: service_healthy
  jev-runner:
    image: ${JEV_IMAGE:-jev-runner:f90209d8d613fbd0066cf0fc081c2b6b4b5fd6ee}
    env_file: ${JEV_ENV_FILE:-/opt/bars/jev-runner.env}
    restart: unless-stopped
    ports: ["127.0.0.1:8644:8643"]
    networks: [bars-senses]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request as u; h=json.load(u.urlopen('http://127.0.0.1:8643/health',timeout=3)); assert h['ok'] and h['typesafe_key']"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=128m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
networks:
  bars-senses:
    internal: true
